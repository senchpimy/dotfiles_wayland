
[cursor]
unfocused_hollow = false

[cursor.style]
blinking = "On"
shape = "Block"

[env]
TERM = "alacritty"
WINIT_X11_SCALE_FACTOR = "1.0"

[window]
decorations = "full"
dynamic_title = true
opacity = 0.58
startup_mode = "Windowed"

[window.dimensions]
columns = 83
lines = 25

[window.padding]
x = 5
y = 5

[general]
live_config_reload = true
import = [
  "/home/plof/.config/alacritty/fonts.toml",
]
