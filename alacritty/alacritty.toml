[cursor]
unfocused_hollow = false

[cursor.style]
blinking = "On"
shape = "Block"

[env]
TERM = "alacritty"
WINIT_X11_SCALE_FACTOR = "1.0"

[window]
decorations = "full"
dynamic_title = true
opacity = 0.60
startup_mode = "Windowed"

[window.padding]
x = 22
y = 22

[general]
live_config_reload = true
import = [
  "/home/plof/.config/alacritty/fonts.toml",
  "/home/plof/.config/alacritty/colors.toml",
]