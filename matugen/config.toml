[config]
post_hook = 'gsettings set org.gnome.desktop.interface gtk-theme "Adwaita" && gsettings set org.gnome.desktop.interface color-scheme "prefer-light" && gsettings set org.gnome.desktop.interface color-scheme "prefer-dark" && dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP && killall -q xdg-desktop-portal-gtk && killall -q xdg-desktop-portal'

[templates.quickshell]
input_path = '~/.config/matugen/templates/ImagePath.qml'
output_path = '~/.config/quickshell/modules/ii/lockscreen/ImagePath.qml'

#[templates.quickshell_pendientes]
#input_path = '~/.config/matugen/templates/pendientes_colores.qml'
##output_path = '~/.config/quickshell/extra/pendientes/Colores.qml'
#output_path = '~/Documents/PythonProjects/TareasGenerador/Colores.qml'

[templates.hyprlock]
input_path = '~/.config/matugen/templates/colors-hyprland.conf'
output_path = '~/.config/hypr/colors.conf'

#[templates.rofi]
#input_path = '~/.config/matugen/templates/colors-hyprland.conf'
#output_path = '~/.config/hypr/colors.conf'

[templates.wlogout]
input_path = '~/.config/matugen/templates/theme.css'
output_path = '~/.config/wlogout/theme.css'

[templates.Xdefaults]
input_path = '~/.config/matugen/templates/.Xdefaults'
output_path = '~/configs/.Xdefaults'

[templates.name1]
input_path = '~/.config/matugen/templates/test.css'
output_path = "~/test.css"
colors_to_compare = [
    { name = "black", color = "#000000" },
    { name = "red", color = "#ff0000" },
    { name = "maroon", color = "#800000" },
    { name = "yellow", color = "#ffff00" },
    { name = "olive", color = "#808000" },
    { name = "lime", color = "#00ff00" },
    { name = "green", color = "#008000" },
    { name = "aqua", color = "#00ffff" },
    { name = "teal", color = "#008080" },
    { name = "blue", color = "#0000ff" },
    { name = "navy", color = "#000080" },
    { name = "fuchsia", color = "#ff00ff" },
    { name = "purple", color = "#800080" },
]
compare_to = "{{colors.primary.default.hex}}"
pre_hook = 'echo "source color {{colors.source_color.default.hex}}, source image {{image}}, closest color {{closest_color}}"'
post_hook = 'echo "after gen"'

[config.custom_colors]
green = "#00FF00"
red = "#FF0000"
blue = { color = "#0000FF", blend = false }

[templates.kitty]
input_path = '~/.config/matugen/templates/kitty.conf'
output_path = '~/.config/kitty/theme.conf'
post_hook = "kill -USR1 $(pidof kitty)"

[templates.alacritty]
input_path = '~/.config/matugen/templates/alacritty.toml'
output_path = '~/.config/alacritty/colors.toml'

#[templates.nvim]
#input_path = '~/.config/matugen/templates/nvim.txt'
#output_path = '~/.config/lvim/nvim.txt'


[templates.gtk3]
input_path = '~/.config/matugen/templates/gtk-colors.css'
output_path = '~/.config/gtk-3.0/gtk.css'
post_hook = "thunar -q"

[templates.gtk4]
input_path = '~/.config/matugen/templates/gtk-colors.css'
output_path = '~/.config/gtk-4.0/gtk.css'

#[templates.kde_colors]
#input_path = '~/.config/matugen/templates/kde/color.txt'
#output_path = '~/.local/state/quickshell/user/generated/color.txt'

[templates.m3colors]
input_path = '~/.config/matugen/templates/colors.json'
output_path = '~/.local/state/quickshell/user/generated/colors.json'

[templates.wallpaper]
input_path = '~/.config/matugen/templates/wallpaper.txt'
output_path = '~/.local/state/quickshell/user/generated/wallpaper/path.txt'
