$mainMod = Super # super / meta / windows key

#$term = st
$term = kitty
$editor = v
$file = nautilus
$browser = firefox

bindd = $mainMod, V, Clipboard history >> clipboard, global, quickshell:overviewClipboardToggle # Clipboard history >> clipboard
bindd = $mainMod+Shift, Tab, Toggle overview, global, quickshell:overviewToggle # [hidden] Toggle overview/launcher (alt)
bindd = $mainMod, Delete, Toggle session menu, global, quickshell:sessionToggle # Toggle session menu
bindd = Super+Alt, M, Toggle media controls, global, quickshell:mediaControlsToggle # Toggle media controls
#bindd = Super+Shift, 8, Toggle cheatsheet, global, quickshell:wallpaperSelectorToggle # Toggle cheatsheet
#bindd = Super+Shift, 8, Toggle cheatsheet, global, quickshell:lock
bind = $mainMod, Q, exec, $scrPath/dontkillsteam.sh # close focused window
bind = $mainMod+Shift, Q, exit, # kill hyprland session
bind = $mainMod, Space, togglefloating, # toggle the window between focus and float
bind = $mainMod, G, togglegroup, # toggle the window between focus and group
bind = $mainMod, D, moveoutofgroup, # toggle the window between focus and group
bind = $mainMod+Shift, E, exec, $scrPath/fuzzel-emoji.sh
#bindd = Super+Shift, T, Character recognition,exec,grim -g "$(slurp $SLURP_ARGS)" "tmp.png" && tesseract "tmp.png" - | wl-copy && rm "tmp.png" # [hidden]
#bind=ALT, TAB, changegroupactive
bind = $mainMod, M, fullscreen, # toggle the window between focus and fullscreen
#bind = $mainMod, B, exec, hyprlock
bind = $mainMod, B, exec, qs -p ~/.config/quickshell/lockscreen.qml
#bind = $mainMod, B, exec, sh /home/plof/block.sh
bind = $mainMod+Shift, F, exec, $scrPath/windowpin.sh # toggle pin on focused window
bind = $mainMod+Shift, Z, exec, woomer #zoom
bind = $mainMod+Shift, M, exec, $HOME/Documents/PythonProjects/audio/.venv/bin/python $HOME/Documents/PythonProjects/audio/src/local_client.py
bind = $mainMod, P, pseudo
bind = $mainMod+Ctrl, P, exec, $scrPath/logoutlaunch.sh # launch logout menu
bind = Ctrl, Escape, exec, killall waybar || waybar # toggle waybar

# Application shortcuts
bind = $mainMod, RETURN, exec, $term # launch terminal emulator
bind = $mainMod, E, exec, $file # launch file manager
#bind = $mainMod, C, exec, $editor # launch text editor
#bind = $mainMod, F, exec, $browser # launch web browser

# Rofi menus
bind = $mainMod, R, exec, pkill -x rofi || $scrPath/runner.sh # launch application launcher
#bind = $mainMod, Tab, exec, workspace, previous
bind=$mainMod,TAB,workspace,previous

# Audio control
bindl  =$mainMod, F6, exec, $scrPath/volumecontrol.sh -o m # toggle audio mute
bindel = $mainMod, F7, exec, $scrPath/volumecontrol.sh -o d # decrease volume
bindel = $mainMod, F8, exec, $scrPath/volumecontrol.sh -o i # increase volume
bindl  =  , XF86AudioMute, exec, $scrPath/volumecontrol.sh -o m # toggle audio mute
bindl  = , XF86AudioMicMute, exec, $scrPath/volumecontrol.sh -i m # toggle microphone mute
bindel = , XF86AudioLowerVolume, exec, $scrPath/volumecontrol.sh -o d # decrease volume
bindel = , XF86AudioRaiseVolume, exec, $scrPath/volumecontrol.sh -o i # increase volume

bind  =  $mainMod, H, exec, $scrPath/keybindings.sh

# Media control
bindl  = , XF86AudioPlay, exec, playerctl play-pause # toggle between media play and pause
bindl  = , XF86AudioPause, exec, playerctl play-pause # toggle between media play and pause
bindl  = , XF86AudioNext, exec, playerctl next # media next
bindl  = , XF86AudioPrev, exec, playerctl previous # media previous

# Brightness control
bindel = $mainMod, F3, exec, qs -c .config/quickshell/shell.qml ipc call brightness increment || brightnessctl s 5%+ 
bindel = $mainMod, F2, exec, qs -c .config/quickshell/shell.qml ipc call brightness increment || brightnessctl s 5%- 

#
# Custom scripts
#bind = $mainMod+Alt, G, exec, $scrPath/gamemode.sh # disable hypr effects for gamemode
bind = $mainMod+Alt, Right, exec, $scrPath/swwwallpaper.sh -n # next wallpaper
bind = $mainMod+Alt, Left, exec, $scrPath/swwwallpaper.sh -p # previous wallpaper
bind = $mainMod+Shift, T, exec, pkill -x rofi || $scrPath/themeselect.sh # launch theme select menu
bind = $mainMod+Shift, A, exec, pkill -x rofi || $scrPath/rofiselect.sh # launch select menu
bind = $mainMod+Shift, W, exec, pkill -x rofi || $scrPath/swwwallselect.sh # launch wallpaper select menu
#bind = $mainMod, V, exec, pkill -x rofi || $scrPath/cliphist.sh c # launch clipboard

# Move/Change window focus
bind = $mainMod, Left, movefocus, l
bind = $mainMod, Right, movefocus, r
bind = $mainMod, Up, movefocus, u
bind = $mainMod, Down, movefocus, d

# --- CAMBIO AQUÍ: Switch workspaces usando el script ---
bind = $mainMod, 1, exec, ~/.config/hypr/monitor_workspaces.sh workspace 1
bind = $mainMod, 2, exec, ~/.config/hypr/monitor_workspaces.sh workspace 2
bind = $mainMod, 3, exec, ~/.config/hypr/monitor_workspaces.sh workspace 3
bind = $mainMod, 4, exec, ~/.config/hypr/monitor_workspaces.sh workspace 4
bind = $mainMod, 5, exec, ~/.config/hypr/monitor_workspaces.sh workspace 5
bind = $mainMod, 6, exec, ~/.config/hypr/monitor_workspaces.sh workspace 6
bind = $mainMod, 7, exec, ~/.config/hypr/monitor_workspaces.sh workspace 7
bind = $mainMod, 8, exec, ~/.config/hypr/monitor_workspaces.sh workspace 8
bind = $mainMod, 9, exec, ~/.config/hypr/monitor_workspaces.sh workspace 9
bind = $mainMod, 0, exec, ~/.config/hypr/monitor_workspaces.sh workspace 10

cursor {

no_hardware_cursors = true

}

# Switch workspaces to a relative workspace
bind = $mainMod+Ctrl, Right, workspace, r+1
bind = $mainMod+Ctrl, Left, workspace, r-1

# Move to the first empty workspace
bind = $mainMod+Ctrl, Down, workspace, empty 

# Resize windows
binde = $mainMod+Shift, Right, resizeactive, 30 0
binde = $mainMod+Shift, Left, resizeactive, -30 0
binde = $mainMod+Shift, Up, resizeactive, 0 -30
binde = $mainMod+Shift, Down, resizeactive, 0 30

bind = $mainMod+Shift, 1, exec, ~/.config/hypr/monitor_workspaces.sh movetoworkspace 1
bind = $mainMod+Shift, 2, exec, ~/.config/hypr/monitor_workspaces.sh movetoworkspace 2
bind = $mainMod+Shift, 3, exec, ~/.config/hypr/monitor_workspaces.sh movetoworkspace 3
bind = $mainMod+Shift, 4, exec, ~/.config/hypr/monitor_workspaces.sh movetoworkspace 4
bind = $mainMod+Shift, 5, exec, ~/.config/hypr/monitor_workspaces.sh movetoworkspace 5
bind = $mainMod+Shift, 6, exec, ~/.config/hypr/monitor_workspaces.sh movetoworkspace 6
bind = $mainMod+Shift, 7, exec, ~/.config/hypr/monitor_workspaces.sh movetoworkspace 7
bind = $mainMod+Shift, 8, exec, ~/.config/hypr/monitor_workspaces.sh movetoworkspace 8
bind = $mainMod+Shift, 9, exec, ~/.config/hypr/monitor_workspaces.sh movetoworkspace 9
bind = $mainMod+Shift, 0, exec, ~/.config/hypr/monitor_workspaces.sh movetoworkspace 10

# Move focused window to a relative workspace
bind = $mainMod+Ctrl+Alt, Right, movetoworkspace, r+1
bind = $mainMod+Ctrl+Alt, Left, movetoworkspace, r-1

# Move focused window around the current workspace
bind = $mainMod+Shift+Ctrl, Left, movewindow, l
bind = $mainMod+Shift+Ctrl, Right, movewindow, r
bind = $mainMod+Shift+Ctrl, Up, movewindow, u
bind = $mainMod+Shift+Ctrl, Down, movewindow, d

# Scroll through existing workspaces
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Move/Resize focused window
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow
bindm = $mainMod, Z, movewindow # FLotante
bindm = $mainMod, X, resizewindow # CAmbiar tamano

# Move/Switch to special workspace (scratchpad)
bind = $mainMod+Alt, S, movetoworkspacesilent, special
bind = $mainMod, S, togglespecialworkspace,
bind = $mainMod+Shift, S, movetoworkspacesilent, +0

# Toggle focused window split
bind = $mainMod, J, togglesplit

bind = $mainMod+Alt, 1, exec, ~/.config/hypr/monitor_workspaces.sh movetoworkspacesilent 1
bind = $mainMod+Alt, 2, exec, ~/.config/hypr/monitor_workspaces.sh movetoworkspacesilent 2
bind = $mainMod+Alt, 3, exec, ~/.config/hypr/monitor_workspaces.sh movetoworkspacesilent 3
bind = $mainMod+Alt, 4, exec, ~/.config/hypr/monitor_workspaces.sh movetoworkspacesilent 4
bind = $mainMod+Alt, 5, exec, ~/.config/hypr/monitor_workspaces.sh movetoworkspacesilent 5
bind = $mainMod+Alt, 6, exec, ~/.config/hypr/monitor_workspaces.sh movetoworkspacesilent 6
bind = $mainMod+Alt, 7, exec, ~/.config/hypr/monitor_workspaces.sh movetoworkspacesilent 7
bind = $mainMod+Alt, 8, exec, ~/.config/hypr/monitor_workspaces.sh movetoworkspacesilent 8
bind = $mainMod+Alt, 9, exec, ~/.config/hypr/monitor_workspaces.sh movetoworkspacesilent 9
bind = $mainMod+Alt, 0, exec, ~/.config/hypr/monitor_workspaces.sh movetoworkspacesilent 10


bindl = , switch:on:Lid Switch, exec, hyprctl dispatch dpms off
bindl = , switch:off:Lid Switch, exec, hyprctl dispatch dpms on

## Posibles funcionalidades'
#
#pin
#swapwindow
#centerwindow
#swapactiveworkspaces
#changegroupactive

bind = $mainMod+Shift+Alt, Left,  movewindoworgroup, l
bind = $mainMod+Shift+Alt, Right, movewindoworgroup, r
bind = $mainMod+Shift+Alt, Up,    movewindoworgroup, u
bind = $mainMod+Shift+Alt, Down,  movewindoworgroup, d
bind = $mainMod, F,  exec, ags run-js 'cycleMode();'


layerrule = animation slide left, match:namespace sideleft.*
layerrule = animation slide right, match:namespace sideright.*
#layerrule = blur on, match:namespace waybar

bind = $mainMod, C,  exec, XDG_CURRENT_DESKTOP="gnome" gnome-control-center

#plugin:overview:hideTopLayers=true
#plugin:overview:overrideGaps=false
#plugin:overview:affectStrut=false
#plugin:overview:exitOnSwitch=true
#plugin:overview:showEmptyWorkspace=false
#plugin:overview:disableGestures=true

#bind = $mainMod, l, overview:toggle




windowrule = float on, match:class ^(com-group_finity-mascot-Main)$
windowrule = no_blur on, match:class ^(com-group_finity-mascot-Main)$
windowrule = no_focus on, match:class ^(com-group_finity-mascot-Main)$
windowrule = no_shadow on, match:class ^(com-group_finity-mascot-Main)$
windowrule = border_size 0, match:class ^(com-group_finity-mascot-Main)$
