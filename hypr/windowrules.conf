source = ~/.config/hypr/colors.conf # initially empty, to be configured by user and remains static

plugin {
    hyprbars {
        bar_height = 0
        bar_color =  $input_back
    }

    imgborders {
        enabled = false
        #image = ~/Downloads/border.png
    	#sizes = 7,4,3,4
        #image = ~/configs/hypr/darkborder.png
        image = ~/configs/hypr/gui.png
    	sizes = 4,4,4,4
    	insets = 3,3,2,2 # left, right, top, bottom
        scale = 4
        smooth = false
        #blur = false
    }

# windowrulev2 = plugin:imgborders:noimgborders, match:class:negative:kitty

#animation = hyprfocusIn, 1, 1.7, myCurve
#animation = hyprfocusOut, 1, 1.7, myCurve2

    hyprfocus {
        enabled = yes
        animate_floating = yes
        animate_workspacechange = yes
        focus_animation = shrink
        # Beziers for focus animations
        bezier = bezIn, 0.5,0.0,1.0,0.5
        bezier = bezOut, 0.0,0.5,0.5,1.0
        bezier = overshot, 0.05, 0.9, 0.1, 1.05
        bezier = smoothOut, 0.36, 0, 0.66, -0.56
        bezier = smoothIn, 0.25, 1, 0.5, 1
        #bezier = realsmooth, 0.28,0.29,.69,1.08
        # Flash settings
        #flash {
        #    flash_opacity = 0.8
        #    in_bezier = realsmooth
        #    in_speed = 1
        #    out_bezier = realsmooth
        #    out_speed = 3
        #}
        # Shrink settings
        shrink {
            shrink_percentage = 0.90
            in_bezier = realsmooth
            in_speed = 1
            out_bezier = realsmooth
            out_speed = 2
        }
    }
}


