# ▄█ █▄█ █▄█ █▀▄ █▄▄ ██▄

source = ~/.config/hypr/theme.conf # theme specific settings
source = ~/.config/hypr/animations.conf
source = ~/.config/hypr/layout_hyprland.conf
source = ~/.config/hypr/keybindings.conf
source = ~/.config/hypr/windowrules.conf
source = ~/.config/hypr/monitors.conf
source = ~/.config/hypr/hyprgrass.conf 
env = QT_QPA_PLATFORM, wayland
env = QT_QPA_PLATFORMTHEME, kde

env = QT_IM_MODULE, fcitx
env = XMODIFIERS, @im=fcitx
env = GTK_IM_MODULE, wayland   # Crashes electron apps in xwayland
# env = GTK_IM_MODULE, fcitx     # My Gtk apps no longer require this to work with fcitx5 hmm  
env = SDL_IM_MODULE, fcitx
env = GLFW_IM_MODULE, ibus
env = INPUT_METHOD, fcitx
#exec-once = qs &

plugin:dynamic-cursors {
    enabled = true

    mode = tilt

    tilt {
        limit = 1000                  # Velocidad (px/s) para alcanzar la inclinación máxima.
        function = negative_quadratic # Función que se siente más agresiva y reactiva.
    }

    stretch {
        limit = 1000
        function = quadratic
    }

    shake {
        enabled = true
        base = 2.5          # Aumento de tamaño inicial. (Antes era 4.0).
        threshold = 3.0     # Sensibilidad (menor es más sensible)
        timeout = 2000      # Tiempo que el cursor permanece grande (en ms)
        speed = 1.0
        nearest = false
        #effects = false     # Desactiva tilt/stretch mientras está agrandado para un look limpio.
    }

    hyprcursor {
        enabled = true
        nearest = false
        resolution = -1
    }
}

monitor=eDP-1,preferred,auto,1,mirror,DP-2
