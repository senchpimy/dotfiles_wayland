input {
    follow_mouse = 1

    touchpad {
        natural_scroll = no
    }

    sensitivity = -1.50
    force_no_accel = 1
}

# See https://wiki.hyprland.org/Configuring/Keywords/#executing

#device {
#    name = epic mouse V1
