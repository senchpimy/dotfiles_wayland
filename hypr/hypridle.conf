$lock_cmd = qs -p ~/.config/quickshell/lockscreen.qml
$suspend_cmd = pidof steam || systemctl suspend || loginctl suspend # fuck nvidia

general {
    lock_cmd = $lock_cmd
    before_sleep_cmd = loginctl lock-session
}

# cool screen saver
listener {
    timeout = 500 # 9mins
    on-timeout = [ -z "$(hyprctl clients -j | jq -r '.[] | select(.class == "neo-matrix")')" ] && alacritty --config-file ~/.config/alacritty/alacritty-neo.toml --class neo-matrix,neo-matrix -e bash -c 'neo-matrix -s' &
    #on-resume = addr=$(hyprctl clients -j | jq -r '.[] | select(.class == "neo-matrix") | .address') && [ -n "$addr" ] && hyprctl dispatch closewindow address:$addr
}

listener {
    # 15 mins
    timeout = 800
    on-timeout = $lock_cmd
}

listener {
    timeout = 120 # 2.5mins
    on-timeout = hyprctl keyword decoration:screen_shader '~/.config/hypr/shaders/obscure.frag'
    on-resume = hyprctl keyword decoration:screen_shader ''
}

listener {
    timeout = 250 # 5mins
    on-timeout = hyprctl keyword decoration:screen_shader '~/.config/hypr/shaders/more_obscure.frag'
    on-resume = hyprctl keyword decoration:screen_shader ''
}

