# Don't print a new line at the start of the prompt
add_newline = false
# Pipes ╰─ ╭─
# Powerline symbols                                     
# Wedges 🭧🭒 🭣🭧🭓
# Random noise 🬖🬥🬔🬗
# Cool stuff 󰜥   

format = """$python$status$hostname$custom(bg:#D6DBE5 black)$cmd_duration
$character
"""

right_format = """$git_branch $git_status"""

[custom.dir]
command = 'Dirpath' 
when = true
style = "bg:green fg:black"
format = '[](green)[$output]($style)[](green)'


[character]                            # The name of the module we are configuring is "character"
success_symbol = "[](bold fg:blue)"
error_symbol = "[](bold fg:red)"

#[character]
#success_symbol = '[➜](bold green)'
#error_symbol = '[✗](bold red) '

[package]
disabled = true


[git_branch]
symbol = "󰘬"
truncation_length = 12
truncation_symbol = ""
style = "fg:black bg:#7F7F7F"
format = "[](fg:#7F7F7F)[ $symbol $branch(:$remote_branch) ]($style)[](fg:#7F7F7F)"

[git_commit]
commit_hash_length = 4
tag_symbol = " "

[git_state]
format = '[\($state( $progress_current of $progress_total)\)](bold red) '
cherry_pick = "[🍒 PICKING](bold red)"

[git_status]
conflicted = "🏳 "
ahead = "⇡${count} "
behind = "⇣${count} "
diverged = "😵 "
untracked = "?${count} "
stashed = "📦 "
modified = "!${count} "
staged = "+${count} "
renamed = "✍️◦${count} "
deleted = "✘${count} "
up_to_date = "✓"
style = "fg:black bg:#e0e0e0"
format = "[ $all_status$ahead_behind ]($style)"

[status]
symbol = '[✗](bg:#DD352E fg:black bold)'
success_symbol = ''
sigint_symbol = ''
format = '$symbol'
map_symbol = true
disabled = false


#[hostname]
#ssh_only = false
#format =  "[•$hostname](bg:cyan bold fg:black)[](bold fg:cyan)"
#trim_at = ".companyname.com"
#disabled = false

[line_break]
disabled = false

#[memory_usage]
#disabled = true
#threshold = -1
#symbol = " "
#style = "bold dimmed green"

[directory]
home_symbol = "  "
read_only = "  "
style = "bg:green fg:black"
truncation_length = 6
truncation_symbol = " ••/"
format = '[](bold fg:green)[󰉋 $path]($style)[](bold fg:green)'


[directory.substitutions]
"Desktop" = "  "
"Documents" = "  "
"Downloads" = "  "
"Music" = " 󰎈 "
"Pictures" = "  "
"Videos" = "  "
"GitHub" = " 󰊤 "

[cmd_duration]
min_time = 5_000
format = '[](bold fg:yellow)[$duration](bold bg:yellow fg:black)[](bold fg:yellow)'

## Prompt Symbols
#
## Git Status
#[git_status]
#style="bg:#e0e0e0 black"
#deleted="✘ ${count} "
#modified="!${count} "
#staged="+${count} "
#ahead="⇡${count}"
#untracked="?${count}"
#format = "[$all_status$ahead_behind ]($style)"
#up_to_date = '✓'
#
## Git Branch
#[git_branch]
#style="bg:#7F7F7F black"
#format="[ $branch ]($style)"
#
## Command Status
#[status]
#symbol = '[✗](bg:#DD352E #000000 bold)'
#success_symbol = ''
#sigint_symbol=''
#format = '$symbol'
#map_symbol = true
#disabled = false
#
## Time Display
[time]
disabled = false
time_format = "%H:%M"
format = "[$time]($style) "

## Command Duration
#[cmd_duration]
#style = 'bg:#0055aa bold'
#format="[$duration ]($style)"
#
## Custom Directory Path
#
## Hostname

[hostname]
format = " $hostname "


[python]
format = '(($virtualenv) )'
pyenv_version_name = true



