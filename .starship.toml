format = """$python$status$hostname[](#D6DBE5)[$custom](bg:#D6DBE5 black)[](#D6DBE5)$cmd_duration
❯ 
"""
right_format = """$character$git_branch$git_status"""

add_newline = false

palette = 'foo'

[palettes.foo]
grey="#808080"
green="#047e84"
blue="#0055aa"
red="#DD352E"
#white="#e0e0e0"
white="#D6DBE5"

# Prompt Symbols
[character]
success_symbol = '[➜](bold green)'
error_symbol = '[✗](bold red) '

# Git Status
[git_status]
style="bg:#e0e0e0 black"
deleted="✘ ${count} "
modified="!${count} "
staged="+${count} "
ahead="⇡${count}"
untracked="?${count}"
format = "[$all_status$ahead_behind ]($style)"
up_to_date = '✓'

# Git Branch
[git_branch]
style="bg:#7F7F7F black"
format="[ $branch ]($style)"

# Command Status
[status]
symbol = '[✗](bg:#DD352E #000000 bold)'
success_symbol = ''
sigint_symbol=''
format = '$symbol'
map_symbol = true
disabled = false

# Time Display
[time]
disabled = false
time_format = "%H:%M"
format = "🕙[$time]($style) "

# Command Duration
[cmd_duration]
style = 'bg:#0055aa bold'
format="[$duration ]($style)"

# Custom Directory Path
[custom.dir]
command = 'Dirpath' 
when = true
format = '$output'

# Hostname
[hostname]
format = " $hostname "

[python]
format = '(($virtualenv) )'
pyenv_version_name = true
